name: CI/CD

on:
  push: 
    branches: ["master"]

jobs: 
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
        
      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist